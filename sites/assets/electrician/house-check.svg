  <g class="sx-breakers"><rect class="sx-breaker" x="1452" y="876" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1482" y="876" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1452" y="898" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1482" y="898" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1452" y="920" width="22" height="14" rx="3"/><rect class="sx-breaker is-off" x="1482" y="920" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1452" y="942" width="22" height="14" rx="3"/><rect class="sx-breaker" x="1482" y="942" width="22" height="14" rx="3"/></g>

