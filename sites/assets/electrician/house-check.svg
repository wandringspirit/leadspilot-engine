  <rect class="sx-meter-box" x="1554" y="672" width="48" height="52" rx="8"/>
  <circle class="sx-meter-glass" cx="1578" cy="698" r="16"/>
  <g transform="translate(1578 698)"><rect class="sx-meter-disc" x="-11" y="-2" width="22" height="4" rx="2"/></g>

